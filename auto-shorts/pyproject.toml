[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-shorts"
version = "0.1.0"
description = "Automatic video-to-shorts pipeline: Whisper + FFmpeg + Streamlit UI"
authors = [ { name = "Auto Shorts", email = "dev@example.com" } ]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click",
    "faster-whisper",
    "pydub",
    "noisereduce",
    "ffmpeg-python",
    "tqdm",
    "numpy",
    "soundfile",
    "streamlit",
    "opencv-python",
    "srt",
    "Pillow>=10.0",
    "uharfbuzz>=0.40",
    "fastapi",
    "uvicorn",
    "python-multipart",
]
