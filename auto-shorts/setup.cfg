[metadata]
name = auto-shorts
version = 0.1.0
description = Automatic video-to-shorts pipeline

[options]
packages = find:
install_requires =
    click
    faster-whisper
    pydub
    noisereduce
    ffmpeg-python
    tqdm
    numpy
    soundfile
    streamlit
    opencv-python
    srt

[options.entry_points]
console_scripts =
    auto-shorts = auto_shorts.cli:cli
